services:
  - type: web
    name: flatmates
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flatmates-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@flatmates.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://flatmates.onrender.com
      - key: PORT
        value: 5000

databases:
  - name: flatmates-db
    plan: free
